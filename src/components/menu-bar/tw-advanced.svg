<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="white">
  <!-- Outer hexagon border -->
  <path d="M512 40 L940 260 L940 764 L512 984 L84 764 L84 260 Z" 
